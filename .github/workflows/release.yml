# Release: gắn tag v* là build APK Android (ký thật) + installer Windows (NSIS)
# rồi đính cả hai vào GitHub Release của tag đó.
#
# Secrets cần có (đặt một lần bằng `gh secret set`):
#   ANDROID_KEYSTORE_BASE64     — mobile/credentials/vong-release.jks mã hoá base64
#   VONG_UPLOAD_STORE_PASSWORD  — mật khẩu keystore
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Giải mã keystore
        run: |
          mkdir -p mobile/credentials
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/credentials/vong-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Prebuild android/
        run: npx expo prebuild --platform android
        working-directory: mobile
      - name: Build APK release
        run: ./gradlew :app:assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a "-PVONG_UPLOAD_STORE_PASSWORD=$VONG_UPLOAD_STORE_PASSWORD"
        working-directory: mobile/android
        env:
          VONG_UPLOAD_STORE_PASSWORD: ${{ secrets.VONG_UPLOAD_STORE_PASSWORD }}
      - name: Đổi tên theo tag
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk "Vong_${GITHUB_REF_NAME#v}_arm64.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: Vong_*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installer NSIS
        run: npm run tauri:build
      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
