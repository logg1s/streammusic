# CI: typecheck + lint cho mọi push/PR vào master.
# Build nặng (APK, installer) nằm ở release.yml, chỉ chạy khi gắn tag.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - name: Typecheck mobile
        run: npx tsc --noEmit
        working-directory: mobile
      - name: Lint mobile
        run: npx eslint .
        working-directory: mobile
