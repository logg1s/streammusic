name: Bug report
description: Something in Vong isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The same symptom often has
        a different root cause on each shell, so the shell and version fields
        below matter a lot — without them a maintainer usually has to ask
        before they can even start.

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      description: Which app were you using?
      options:
        - Web (streammusic.vercel.app)
        - Web (self-hosted)
        - Windows (native app)
        - Android (native app)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: >
        Windows/Android: shown in Settings. Web: the date you last used it is
        fine if there's no visible version number.
      placeholder: "e.g. 0.3.0, or 2026-08-16"
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Area
      description: Best guess at what this touches — pick the closest one.
      options:
        - Playback (audio cuts out, wrong track, seeking)
        - YouTube (search, radio, resolving audio)
        - Library scanning / storage provider (Drive, Dropbox, OneDrive)
        - Sign-in / OAuth
        - UI / visual
        - Background playback / lock screen / media keys
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Does it reproduce every time?
      options:
        - "Yes, every time"
        - "Sometimes"
        - "Happened once, couldn't reproduce it since"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: >
        Browser devtools console, `adb logcat` for Android, or the Windows
        app's log output, if you have it. Paste text as text, not a
        screenshot, where possible.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        OS version, device model, network conditions — whatever seems
        relevant.
